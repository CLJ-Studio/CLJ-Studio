# Despliegue automatico en Netlify.
#
# Netlify no trae Flutter instalado, asi que el build lo clona antes de
# compilar. La primera vez tarda unos minutos; despues queda en cache.
#
# `base` hace que todo corra dentro de Frontend/, y `publish` es relativo
# a esa carpeta.

[build]
  base = "Frontend"
  publish = "build/web"
  command = """
    if [ -d flutter ]; then
      cd flutter && git pull && cd ..;
    else
      git clone https://github.com/flutter/flutter.git -b stable --depth 1;
    fi
    flutter/bin/flutter config --enable-web
    flutter/bin/flutter build web --release --wasm       --dart-define=VERSION_APP="${COMMIT_REF:-local}"       --dart-define=FECHA_VERSION="$(TZ=BOT4 date +%-d.%-m.%H%M)"
  """

[build.environment]
  # Flutter necesita saber donde escribir su cache durante el build.
  PUB_CACHE = "/opt/build/cache/.pub-cache"

# ----------------------------------------------------------------------------
# Un archivo que falta tiene que fallar como archivo que falta
#
# La regla comodin de mas abajo manda index.html con codigo 200 para
# CUALQUIER ruta que no exista. Para una ruta de la aplicacion eso es lo
# correcto. Para main.dart.js NO: el navegador recibe una pagina HTML donde
# esperaba JavaScript, revienta al interpretarla y el motor de Flutter no
# arranca nunca. Lo que se ve entonces es el fondo del HTML -crema- fijo
# para siempre, sin un solo error visible.
#
# Y esto pasa de verdad: el service worker de una PWA guarda la lista de
# archivos de la version que instalo. Al desplegar una version nueva, los
# archivos viejos dejan de existir; si ese service worker sigue vivo, pide
# archivos que ya no estan. Con 404 se da cuenta y se rinde; con 200 y HTML
# se queda colgado.
#
# Netlify sirve primero los archivos que existen, asi que estas reglas solo
# afectan a los que faltan.
#
# Solo hay reglas de carpeta: en Netlify el asterisco unicamente vale al
# final de la ruta, asi que no se puede escribir "/*.js". Los archivos
# sueltos de la raiz (main.dart.js, flutter.js, flutter_bootstrap.js) tienen
# nombre fijo entre versiones y por tanto siempre existen; los que pueden
# desaparecer de un despliegue a otro son los de estas dos carpetas.
# ----------------------------------------------------------------------------
[[redirects]]
  from = "/assets/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/canvaskit/*"
  to = "/index.html"
  status = 404

# Respaldo del archivo web/_redirects, por si el build no lo copiara:
# sin esto, recargar una ruta interna devuelve 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ----------------------------------------------------------------------------
# Que se cachea y que no
#
# NADA se guarda a largo plazo, y es a proposito. Flutter web NO pone un hash
# en el nombre de sus archivos: la fuente de iconos se recorta en cada build
# con solo los iconos que se usan, pero sigue llamandose igual; el motor de
# canvaskit/ cambia cada vez que Netlify baja una version nueva de Flutter, y
# tambien se llama igual. Guardarlos un anio (como estuvo del 22 de septiembre
# al 3 de octubre) hacia que un telefono mezclara una version vieja con una
# nueva: iconos que se veian como cuadrados vacios, o un motor que no
# coincidia con la aplicacion.
#
# `no-cache` no significa "no guardar": el navegador guarda igual, pero
# pregunta antes de usar. Si el archivo no cambio, el servidor contesta 304
# (unos pocos bytes) y se usa lo guardado. Es lo que Netlify ya hace por
# defecto con todo; aqui se deja escrito para los archivos de arranque.
# ----------------------------------------------------------------------------
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"

# ----------------------------------------------------------------------------
# Fluidez: el motor de WebAssembly, dibujando en un hilo aparte
# ----------------------------------------------------------------------------
# La app se compila con --wasm. Los navegadores que soportan WebAssembly
# moderno (Chrome y Firefox actuales, Safari 18.2+) usan el motor skwasm; los
# demas caen solos a la version de JavaScript, que tambien se publica. Nadie
# se queda sin app.
#
# Estas dos cabeceras dejan a skwasm dibujar en un hilo aparte, y es de donde
# sale casi toda la mejora. Medido en Chrome sobre la animacion de apertura y
# la pantalla de acceso (4 corridas cada uno):
#
#   motor JavaScript de antes          5-6 cuadros lentos, el peor de 83-90 ms
#   WebAssembly en un solo hilo        5 cuadros lentos,   el peor de 63-69 ms
#   WebAssembly en hilo aparte         1 cuadro lento,     el peor de 35 ms
#
# `credentialless` y no `require-corp`: con require-corp el navegador exige que
# cada recurso de otro dominio lo autorice con una cabecera propia, y las
# fotos de Supabase no la mandan. Con credentialless se piden sin cookies,
# que es justo como se piden igual. Comprobado con una foto real del bucket:
# carga por fetch, por <img> y por <img crossorigin>.
#
# Safari no entiende credentialless: ahi la pagina simplemente no queda
# aislada y skwasm corre en un solo hilo. Funciona igual, sin la mejora extra.
#
# OJO, 2026-10-07: el hilo aparte esta APAGADO desde web/flutter_bootstrap.js
# (forceSingleThreadedSkwasm). En Flutter 3.44 corrompe la cache de letras con
# mucho texto (el chat de MacIAs salio con letras cambiadas en un Galaxy A15;
# flutter/flutter#190039). Las cabeceras se quedan: al pasar a Flutter 3.48,
# que trae el arreglo, basta con quitar esa opcion para recuperar el hilo.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

# El tipo de cada archivo del motor, escrito a mano. Si el .mjs llegara como
# texto plano, el navegador se niega a cargarlo como modulo y la app NO
# arranca: ese fallo no tiene vuelta atras automatica a la version de
# JavaScript. Paso en las pruebas locales con un servidor que no lo conocia.
[[headers]]
  for = "/main.dart.mjs"
  [headers.values]
    Content-Type = "text/javascript"

[[headers]]
  for = "/main.dart.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/canvaskit/skwasm.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/canvaskit/skwasm_heavy.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/canvaskit/canvaskit.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/canvaskit/chromium/canvaskit.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/canvaskit/wimp.wasm"
  [headers.values]
    Content-Type = "application/wasm"
