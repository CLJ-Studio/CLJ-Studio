<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Marketplace exclusivo para estudiantes UPSA.">
  <!-- La pantalla de acceso arranca siempre clara. Sin esta preferencia,
       iOS puede pintar de negro su barra aunque Flutter ya use fondo blanco. -->
  <meta name="color-scheme" content="light">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <!-- El color lo ajusta ControladorTema al cambiar entre claro y oscuro:
       si queda fijo, la barra de estado muestra una franja de otro color y
       la app parece recortada. -->
  <meta name="theme-color" content="#FFFFFF">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!--
    En algunos iPhone WebKit mantiene una franja negra con
    `black-translucent` aunque el viewport use `viewport-fit=cover`.
    `default` conserva la barra dentro del área segura y la integra con el
    fondo claro de la aplicación.
  -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="UPSA Eat">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>UPSA Eat</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --app-background: #FFFFFF;
      color-scheme: light;
      background-color: var(--app-background);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior-x: none;
      background-color: var(--app-background);
    }

    body {
      position: fixed;
      inset: 0;
    }

    flutter-view {
      display: block;
      width: 100%;
      height: 100%;
      background-color: var(--app-background);
    }
  </style>
</head>
<body>
  <script>
    /*
     * Chrome dispara beforeinstallprompt en cuanto valida el manifest, que
     * suele ser antes de que Flutter termine de arrancar. Si nadie escucha
     * en ese momento el evento se pierde y el botón de instalar no aparece
     * hasta recargar. Aquí solo se guarda; toda la lógica vive en Dart.
     *
     * Es a propósito lo mínimo posible: si el navegador sirve una copia
     * cacheada de este archivo sin esta línea, Dart tiene su propio listener
     * y lo único que se pierde es cazar el evento más temprano.
     */
    window.addEventListener('beforeinstallprompt', (evento) => {
      evento.preventDefault();
      window.eventoInstalacion = evento;
    });
  </script>
  <script>
    /*
     * Adopta la versión nueva en cuanto existe, sin esperar a que se cierren
     * todas las pestañas.
     *
     * Por defecto un service worker nuevo se queda "en espera" mientras el
     * anterior siga controlando alguna ventana. En una PWA instalada en la
     * pantalla de inicio eso casi nunca ocurre, así que la aplicación se
     * queda con una versión vieja indefinidamente: se corregía un fallo, se
     * desplegaba, y en el teléfono seguía apareciendo el de antes.
     *
     * El service worker que genera Flutter escucha el mensaje 'skipWaiting',
     * así que basta con avisarle y recargar cuando tome el control.
     */
    (() => {
      if (!('serviceWorker' in navigator)) return;

      // Evita el bucle: tras recargar una vez ya se está en la última.
      let recargando = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (recargando) return;
        recargando = true;
        window.location.reload();
      });

      navigator.serviceWorker.ready.then((registro) => {
        const adoptar = (trabajador) => {
          if (!trabajador) return;
          trabajador.addEventListener('statechange', () => {
            // Solo si ya había uno controlando: en la primera visita no hay
            // nada viejo que reemplazar ni motivo para recargar.
            if (
              trabajador.state === 'installed' &&
              navigator.serviceWorker.controller
            ) {
              trabajador.postMessage('skipWaiting');
            }
          });
        };

        // El que ya estaba esperando de una visita anterior.
        if (registro.waiting) registro.waiting.postMessage('skipWaiting');
        registro.addEventListener('updatefound', () =>
          adoptar(registro.installing),
        );
      });
    })();
  </script>
  <script>
    /*
     * Puente para las notificaciones push.
     *
     * Vive aquí y no en Dart porque PushManager espera la clave VAPID como
     * Uint8Array en base64url, una conversión que en JS es directa y desde
     * Dart obligaría a marshalar tipos binarios.
     */
    (() => {
      /*
       * Ámbito propio para el service worker de push.
       *
       * Registrarlo en la raíz desplazaría al que genera Flutter, que es el
       * que da el modo sin conexión de la PWA: dos service workers no pueden
       * controlar el mismo ámbito. Un ámbito aparte los deja convivir; para
       * recibir push no hace falta controlar la página.
       */
      const AMBITO = 'push/';

      const registroPush = () =>
        navigator.serviceWorker.register('push_sw.js', { scope: AMBITO });

      window.suscribirPush = async (clavePublica) => {
        const registro = await registroPush();

        const previa = await registro.pushManager.getSubscription();
        if (previa) return JSON.stringify(previa);

        const base64 = (clavePublica + '='.repeat((4 - clavePublica.length % 4) % 4))
          .replace(/-/g, '+')
          .replace(/_/g, '/');
        const crudo = atob(base64);
        const bytes = new Uint8Array(crudo.length);
        for (let i = 0; i < crudo.length; i++) bytes[i] = crudo.charCodeAt(i);

        const suscripcion = await registro.pushManager.subscribe({
          // Obligatorio en Chrome: prohíbe enviar push silenciosos.
          userVisibleOnly: true,
          applicationServerKey: bytes,
        });

        return JSON.stringify(suscripcion);
      };

      /* Endpoint actual, o cadena vacía si el dispositivo no está suscrito. */
      window.estadoPush = async () => {
        const registro = await navigator.serviceWorker.getRegistration(AMBITO);
        if (!registro) return '';
        const suscripcion = await registro.pushManager.getSubscription();
        return suscripcion ? suscripcion.endpoint : '';
      };

      /*
       * Cancela la suscripción y devuelve el endpoint que tenía, para que
       * el servidor pueda olvidar el dispositivo. El permiso del navegador
       * sigue concedido: volver a activar no vuelve a preguntar.
       */
      window.desuscribirPush = async () => {
        const registro = await navigator.serviceWorker.getRegistration(AMBITO);
        if (!registro) return '';
        const suscripcion = await registro.pushManager.getSubscription();
        if (!suscripcion) return '';

        const endpoint = suscripcion.endpoint;
        await suscripcion.unsubscribe();
        return endpoint;
      };
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
