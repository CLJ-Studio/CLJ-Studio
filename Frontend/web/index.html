<head>

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Marketplace exclusivo para estudiantes UPSA.">
  <meta name="theme-color" content="#087F5B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="UPSA Eat">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>UPSA Eat</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /*
     * Evita que el desplazamiento horizontal llegue al navegador y active
     * la navegación hacia atrás/adelante en la PWA.
     */
    html,
    body {
      overscroll-behavior-x: none;
    }
  </style>
</head>
<body>
  <script>
    /*
     * Safari no respeta overscroll-behavior en todas sus versiones.
     * Bloqueamos únicamente los gestos que nacen en los bordes, sin afectar
     * listas horizontales como la barra de categorías.
     */
    (() => {
      const edgeWidth = 28;
      let edgeGesture = false;

      document.addEventListener('touchstart', (event) => {
        if (event.touches.length !== 1) {
          edgeGesture = false;
          return;
        }

        const x = event.touches[0].clientX;
        edgeGesture = x <= edgeWidth || x >= window.innerWidth - edgeWidth;

        if (edgeGesture && event.cancelable) {
          event.preventDefault();
        }
      }, { passive: false, capture: true });

      document.addEventListener('touchmove', (event) => {
        if (edgeGesture && event.cancelable) {
          event.preventDefault();
        }
      }, { passive: false, capture: true });

      const finishEdgeGesture = () => {
        edgeGesture = false;
      };

      document.addEventListener('touchend', finishEdgeGesture, {
        passive: true,
        capture: true,
      });
      document.addEventListener('touchcancel', finishEdgeGesture, {
        passive: true,
        capture: true,
      });
    })();
  </script>
  <script>
    /*
     * Puente para las notificaciones push.
     *
     * La suscripción vive aquí y no en Dart porque PushManager espera la
     * clave VAPID como Uint8Array en base64url, una conversión que en JS
     * es directa y desde Dart obligaría a marshalar tipos binarios.
     * Devuelve la suscripción como texto JSON, que Dart sí maneja bien.
     */
    window.suscribirPush = async (clavePublica) => {
      const registro = await navigator.serviceWorker.ready;

      const suscripcionPrevia = await registro.pushManager.getSubscription();
      if (suscripcionPrevia) return JSON.stringify(suscripcionPrevia);

      const base64 = (clavePublica + '='.repeat((4 - clavePublica.length % 4) % 4))
        .replace(/-/g, '+')
        .replace(/_/g, '/');
      const crudo = atob(base64);
      const bytes = new Uint8Array(crudo.length);
      for (let i = 0; i < crudo.length; i++) bytes[i] = crudo.charCodeAt(i);

      const suscripcion = await registro.pushManager.subscribe({
        // Obligatorio en Chrome: prohíbe enviar push silenciosos.
        userVisibleOnly: true,
        applicationServerKey: bytes,
      });

      return JSON.stringify(suscripcion);
    };
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
