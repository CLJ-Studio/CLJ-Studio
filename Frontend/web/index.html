<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Marketplace exclusivo para estudiantes UPSA.">
  <!-- La pantalla de acceso arranca siempre clara. Sin esta preferencia,
       iOS puede pintar de negro su barra aunque Flutter ya use fondo blanco. -->
  <meta name="color-scheme" content="light">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <!-- El color lo ajusta ControladorTema al cambiar entre claro y oscuro:
       si queda fijo, la barra de estado muestra una franja de otro color y
       la app parece recortada. -->
  <meta name="theme-color" content="#E6E1D5">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!--
    En algunos iPhone WebKit mantiene una franja negra con
    `black-translucent` aunque el viewport use `viewport-fit=cover`.
    `default` conserva la barra dentro del área segura y la integra con el
    fondo claro de la aplicación.
  -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="U market">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>U market</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --app-background: #E6E1D5;
      color-scheme: light;
      background-color: var(--app-background);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior-x: none;
      background-color: var(--app-background);
    }

    body {
      position: fixed;
      inset: 0;
    }

    flutter-view {
      display: block;
      width: 100%;
      height: 100%;
      background-color: var(--app-background);
    }

    /*
     * LA PANTALLA CREMA.
     *
     * El fondo de arriba es #E6E1D5, el mismo crema del tema. Es lo que se
     * ve desde que el navegador abre la pagina hasta que Flutter pinta su
     * primer cuadro. Si el motor no llega a arrancar nunca -por ejemplo
     * porque el service worker de la PWA guardo una version vieja y pide un
     * archivo que ya no existe-, ese crema se queda ahi para siempre y NO
     * HAY CODIGO DART QUE PUEDA ARREGLARLO: Dart no llego a correr.
     *
     * Por eso el arranque tiene cara propia, en HTML y CSS puros, sin
     * depender de nada que pueda fallar. Mientras carga se ve el logo; si
     * pasado un rato Flutter sigue sin dar senales, se ofrece salida.
     */
    #arranque {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      box-sizing: border-box;
      background-color: var(--app-background);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #474646;
      text-align: center;
    }

    #arranque img {
      width: 84px;
      height: 84px;
      border-radius: 22px;
    }

    #arranque-girando {
      width: 26px;
      height: 26px;
      border: 3px solid rgba(71, 70, 70, .22);
      border-top-color: #474646;
      border-radius: 50%;
      animation: arranque-giro 900ms linear infinite;
    }

    @keyframes arranque-giro {
      to { transform: rotate(360deg); }
    }

    /* Respeta a quien pidió menos movimiento en su sistema. */
    @media (prefers-reduced-motion: reduce) {
      #arranque-girando { animation-duration: 2400ms; }
    }

    #arranque-fallo {
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #arranque-fallo .titulo {
      margin: 0;
      font-size: 19px;
      font-weight: 800;
    }

    #arranque-fallo .texto {
      margin: 0;
      font-size: 14px;
      line-height: 1.45;
      color: #6d6c6a;
    }

    #arranque-fallo .detalle {
      margin: 4px 0 0;
      font-size: 11px;
      line-height: 1.4;
      color: #8d8b88;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    #arranque-reintentar {
      margin-top: 6px;
      padding: 13px 30px;
      border: 0;
      border-radius: 999px;
      background-color: #474646;
      color: #E6E1D5;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    /* Acotado a la capa de arranque: una regla global podria tapar
       elementos que Flutter marca como ocultos por su cuenta. */
    #arranque [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="arranque" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="" />
    <div id="arranque-girando"></div>
    <div id="arranque-fallo" hidden>
      <p class="titulo">No pudimos abrir U market</p>
      <p class="texto">
        Puede que el teléfono haya guardado una versión vieja de la
        aplicación. Esto la borra y vuelve a bajarla.
      </p>
      <button type="button" id="arranque-reintentar">Reintentar</button>
      <p class="detalle" id="arranque-detalle" hidden></p>
    </div>
  </div>

  <script>
    /*
     * Vigilante del arranque. Es lo ultimo que queda en pie cuando falla
     * cualquier otra cosa, asi que no usa nada moderno ni depende de ningun
     * otro script de esta pagina.
     *
     * `flutter-first-frame` lo dispara el propio motor de Flutter al pintar
     * por primera vez. Si llega, se quita la capa y aqui no paso nada. Si no
     * llega en DEMORA_LIMITE, la aplicacion esta colgada antes de Dart: se
     * intenta una recuperacion automatica (borrar service workers y caches,
     * que es lo que deja la PWA servida con una version rota) y, si al
     * volver tampoco arranca, se le da el boton a la persona.
     *
     * La marca de "ya lo intente" vive en sessionStorage y no en una
     * variable: una variable se reinicia con la recarga, y entonces esto
     * seria un bucle de recargas en vez de un arreglo.
     */
    (() => {
      var DEMORA_LIMITE = 12000;
      var YA_RECUPERE = 'umarket-recuperado';

      var capa = document.getElementById('arranque');
      var girando = document.getElementById('arranque-girando');
      var fallo = document.getElementById('arranque-fallo');
      var boton = document.getElementById('arranque-reintentar');
      var detalle = document.getElementById('arranque-detalle');
      if (!capa) return;

      /*
       * El primer error del arranque, guardado para ensenarlo si hace falta.
       *
       * Esta pantalla ya aparecio varias veces y cada vez habia que adivinar
       * la causa desde cero, porque un fondo de color no dice nada. Con esto,
       * la proxima vez la pantalla trae su propio motivo escrito.
       */
      var primerError = '';
      function apunta(texto) {
        if (!primerError && texto) primerError = String(texto).slice(0, 300);
      }
      window.addEventListener('error', function (evento) {
        apunta(
          evento && evento.message
            ? evento.message + (evento.filename ? ' · ' + evento.filename : '')
            : 'error al cargar un archivo'
        );
      }, true);
      window.addEventListener('unhandledrejection', function (evento) {
        apunta(evento && evento.reason ? evento.reason : 'promesa rechazada');
      });

      // sessionStorage lanza excepcion en ventana privada o con los datos
      // del sitio bloqueados. Sin memoria, se prefiere no recuperar sola:
      // mejor ensenar el boton una vez que recargar sin fin.
      function recuerda(clave) {
        try { return !!sessionStorage.getItem(clave); } catch (_) { return true; }
      }
      function anota(clave) {
        try { sessionStorage.setItem(clave, '1'); } catch (_) {}
      }
      window.memoriaArranque = { recuerda: recuerda, anota: anota };

      var vigilante = null;
      var arranco = false;

      function arrancoBien() {
        if (arranco) return;
        arranco = true;
        if (vigilante) clearTimeout(vigilante);
        capa.remove();
      }
      window.addEventListener('flutter-first-frame', arrancoBien);

      function mostrarFallo() {
        girando.hidden = true;
        fallo.hidden = false;
        if (primerError) {
          detalle.textContent = primerError;
          detalle.hidden = false;
        }
      }

      /* Deja el dispositivo como en la primera visita y vuelve a empezar. */
      function borrarYRecargar() {
        var tareas = [];
        try {
          if ('serviceWorker' in navigator) {
            tareas.push(
              navigator.serviceWorker.getRegistrations().then(function (todos) {
                return Promise.all(todos.map(function (uno) { return uno.unregister(); }));
              })
            );
          }
        } catch (_) {}
        try {
          if (window.caches) {
            tareas.push(
              caches.keys().then(function (nombres) {
                return Promise.all(nombres.map(function (n) { return caches.delete(n); }));
              })
            );
          }
        } catch (_) {}

        var volver = function () { window.location.reload(); };
        Promise.all(tareas).then(volver, volver);
        // Si algo se quedara colgado borrando, se recarga igual.
        setTimeout(volver, 4000);
      }

      vigilante = setTimeout(function () {
        if (arranco) return;
        if (recuerda(YA_RECUPERE)) {
          // Ya se limpio en esta sesion y sigue sin arrancar: el problema no
          // era la copia guardada. Se lo decimos en vez de recargar en bucle.
          mostrarFallo();
          return;
        }
        anota(YA_RECUPERE);
        borrarYRecargar();
      }, DEMORA_LIMITE);

      boton.addEventListener('click', function () {
        boton.disabled = true;
        boton.textContent = 'Limpiando...';
        borrarYRecargar();
      });
    })();
  </script>
  <script>
    /*
     * Chrome dispara beforeinstallprompt en cuanto valida el manifest, que
     * suele ser antes de que Flutter termine de arrancar. Si nadie escucha
     * en ese momento el evento se pierde y el botón de instalar no aparece
     * hasta recargar. Aquí solo se guarda; toda la lógica vive en Dart.
     *
     * Es a propósito lo mínimo posible: si el navegador sirve una copia
     * cacheada de este archivo sin esta línea, Dart tiene su propio listener
     * y lo único que se pierde es cazar el evento más temprano.
     */
    window.addEventListener('beforeinstallprompt', (evento) => {
      evento.preventDefault();
      window.eventoInstalacion = evento;
    });
  </script>
  <script>
    /*
     * Adopta la versión nueva en cuanto existe, sin esperar a que se cierren
     * todas las pestañas.
     *
     * Por defecto un service worker nuevo se queda "en espera" mientras el
     * anterior siga controlando alguna ventana. En una PWA instalada en la
     * pantalla de inicio eso casi nunca ocurre, así que la aplicación se
     * queda con una versión vieja indefinidamente: se corregía un fallo, se
     * desplegaba, y en el teléfono seguía apareciendo el de antes.
     *
     * El service worker que genera Flutter escucha el mensaje 'skipWaiting',
     * así que basta con avisarle y recargar cuando tome el control.
     */
    (() => {
      if (!('serviceWorker' in navigator)) return;

      /*
       * Una sola recarga por sesión, y la marca vive en sessionStorage.
       *
       * Antes era una variable de la página, que se reinicia justamente al
       * recargar: si el control cambiaba otra vez -y con dos service workers
       * conviviendo puede pasar- la guardia ya valía cero y la página se
       * quedaba recargándose sin llegar nunca a pintar. Por fuera eso se ve
       * igual que una pantalla crema congelada.
       */
      const memoria = window.memoriaArranque;
      const YA_RECARGUE = 'umarket-sw-recargado';

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!memoria || memoria.recuerda(YA_RECARGUE)) return;
        memoria.anota(YA_RECARGUE);
        window.location.reload();
      });

      navigator.serviceWorker.ready.then((registro) => {
        const adoptar = (trabajador) => {
          if (!trabajador) return;
          trabajador.addEventListener('statechange', () => {
            // Solo si ya había uno controlando: en la primera visita no hay
            // nada viejo que reemplazar ni motivo para recargar.
            if (
              trabajador.state === 'installed' &&
              navigator.serviceWorker.controller
            ) {
              trabajador.postMessage('skipWaiting');
            }
          });
        };

        // El que ya estaba esperando de una visita anterior.
        if (registro.waiting) registro.waiting.postMessage('skipWaiting');
        registro.addEventListener('updatefound', () =>
          adoptar(registro.installing),
        );
      });
    })();
  </script>
  <script>
    /*
     * Puente para las notificaciones push.
     *
     * Vive aquí y no en Dart porque PushManager espera la clave VAPID como
     * Uint8Array en base64url, una conversión que en JS es directa y desde
     * Dart obligaría a marshalar tipos binarios.
     */
    (() => {
      /*
       * Ámbito propio para el service worker de push.
       *
       * Registrarlo en la raíz desplazaría al que genera Flutter, que es el
       * que da el modo sin conexión de la PWA: dos service workers no pueden
       * controlar el mismo ámbito. Un ámbito aparte los deja convivir; para
       * recibir push no hace falta controlar la página.
       */
      const AMBITO = 'push/';

      const registroPush = () =>
        navigator.serviceWorker.register('push_sw.js', { scope: AMBITO });

      window.suscribirPush = async (clavePublica) => {
        const registro = await registroPush();

        const previa = await registro.pushManager.getSubscription();
        if (previa) return JSON.stringify(previa);

        const base64 = (clavePublica + '='.repeat((4 - clavePublica.length % 4) % 4))
          .replace(/-/g, '+')
          .replace(/_/g, '/');
        const crudo = atob(base64);
        const bytes = new Uint8Array(crudo.length);
        for (let i = 0; i < crudo.length; i++) bytes[i] = crudo.charCodeAt(i);

        const suscripcion = await registro.pushManager.subscribe({
          // Obligatorio en Chrome: prohíbe enviar push silenciosos.
          userVisibleOnly: true,
          applicationServerKey: bytes,
        });

        return JSON.stringify(suscripcion);
      };

      /* Endpoint actual, o cadena vacía si el dispositivo no está suscrito. */
      window.estadoPush = async () => {
        const registro = await navigator.serviceWorker.getRegistration(AMBITO);
        if (!registro) return '';
        const suscripcion = await registro.pushManager.getSubscription();
        return suscripcion ? suscripcion.endpoint : '';
      };

      /*
       * Cancela la suscripción y devuelve el endpoint que tenía, para que
       * el servidor pueda olvidar el dispositivo. El permiso del navegador
       * sigue concedido: volver a activar no vuelve a preguntar.
       */
      window.desuscribirPush = async () => {
        const registro = await navigator.serviceWorker.getRegistration(AMBITO);
        if (!registro) return '';
        const suscripcion = await registro.pushManager.getSubscription();
        if (!suscripcion) return '';

        const endpoint = suscripcion.endpoint;
        await suscripcion.unsubscribe();
        return endpoint;
      };
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
