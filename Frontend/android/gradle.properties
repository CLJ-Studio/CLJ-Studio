org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin compila los plugins SIN cache incremental.
#
# Con la cache puesta, el build de Android falla en Windows antes de empezar:
#
#   Could not close incremental caches in ...\caches-jvm\jvm\kotlin:
#   class-fq-name-to-source.tab, source-to-classes.tab, ...
#
# Le pasa a photo_manager y a camera_android_camerax, que son los dos plugins
# con codigo Kotlin. No es un problema del proyecto: es la API nueva de
# compilacion de Kotlin 2.x, que en Windows no suelta los descriptores de esos
# .tab y revienta al cerrarlos.
#
# Lo que se pierde es recompilar solo lo que cambio DENTRO de los plugins, y
# los plugins no se tocan nunca: entre eso y no poder compilar, no hay debate.
kotlin.incremental=false
